name: C++ tests

# The test suite needs no R, so this is fast and can run on every push. It also
# catches the portability problems that have bitten this code before -- long double
# width and FMA contraction differing between compilers and architectures (see the
# arm64 note in Leaf::hydraulic_cost_Sperry), which a single-platform build misses.

on:
  push:
    # This repo's default branch is master, not main. It was [main] until
    # 2026-08-03, which meant no push ever triggered a run and the workflow sat
    # unexercised from the day it was added until the first pull request.
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cxx: g++ }
          - { os: ubuntu-latest, cxx: clang++ }
          - { os: macos-latest, cxx: clang++ }

    name: ${{ matrix.os }} / ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v4

      # odelia supplies the spline interpolator and the vendored XAD headers. Both
      # are header-only, so a shallow checkout of the sibling repo is enough --
      # nothing needs installing or building.
      - name: Check out odelia (header-only dependency)
        uses: actions/checkout@v4
        with:
          repository: traitecoevo/odelia
          path: odelia
          fetch-depth: 1

      - name: Install Boost headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libboost-dev

      - name: Install Boost headers (macOS)
        if: runner.os == 'macOS'
        run: brew install boost

      - name: Resolve Boost include path
        id: boost
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "inc=$(brew --prefix boost)/include" >> "$GITHUB_OUTPUT"
          else
            echo "inc=/usr/include" >> "$GITHUB_OUTPUT"
          fi

      # The golden file is compared bit-exactly on the platform that generated it
      # (macOS/arm64) and with per-field tolerances everywhere else. This is not a
      # loosening: libm's exp/pow are not bit-reproducible between glibc on
      # x86-64 and Apple's libm on arm64, so bit-exactness across platforms was
      # never achievable. Measured, the fields split into two classes -- profit
      # (the maximum) at 2.1e-7, and everything derived from the argmax at 4.5e-4,
      # because the profit maximum is flat and displacing it goes as sqrt. See the
      # comment above main() in tests/cpp/test_golden.cpp.
      - name: Resolve golden comparison mode
        id: golden
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "args=--cross-platform" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and run
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          make -C tests/cpp \
            CXX="$CXX" \
            ODELIA_INC="$GITHUB_WORKSPACE/odelia/inst/include" \
            BH_INC="${{ steps.boost.outputs.inc }}" \
            GOLDEN_ARGS="${{ steps.golden.outputs.args }}"

      # Compile the benchmark but do not run it. It is a timing harness, so it
      # would be a flaky gate on a shared runner; building it keeps it from
      # rotting when the headers change.
      - name: Build the benchmark (compile only)
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          make -C tests/cpp bench_solve \
            CXX="$CXX" \
            ODELIA_INC="$GITHUB_WORKSPACE/odelia/inst/include" \
            BH_INC="${{ steps.boost.outputs.inc }}"

      - name: Note on failure
        if: failure()
        run: |
          echo "If only the golden test failed, read the worst-relative-difference"
          echo "line it printed before doing anything else."
          echo
          echo "  ~1e-15  reassociation / cross-platform libm. Not a regression."
          echo "  ~1e-4   a real change in behaviour."
          echo
          echo "Linux already compares with --cross-platform, so a failure here is"
          echo "either genuinely large or an amplified solver decision (these"
          echo "nested solvers amplify up to about GSS_tol_abs, 1e-3)."
          echo
          echo "Do NOT regenerate the golden file to make this pass. It is"
          echo "generated on macOS/arm64; regenerating elsewhere just moves the"
          echo "failure to the other platform. See tests/cpp/test_golden.cpp."
