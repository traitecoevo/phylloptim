    default_code: phylloptim::ko_ha
  phi_J:
    section: biochemistry
    symbol: '\phi_J'
    units: 'mol e⁻ (mol absorbed photon)⁻¹'
    class: trait
    meaning: 'quantum yield of electron transport per absorbed photon; no temperature dependence (was $a$, per incident photon, before 0.13.0; only $\phi_J \alpha_\mathrm{PAR}$ is identified by a gas-exchange fit)'
    source: E. saligna default, 0.30 / 0.85
    placeholder: false
    code: phylloptim::Leaf::phi_J
  alpha_PAR_:
    section: biochemistry
    symbol: '\alpha_\mathrm{PAR}'
    units: '–'
    class: hyperparameter
    meaning: 'PAR absorptance: the leaf absorbs $\alpha_\mathrm{PAR}$ of the intercepted PPFD, in both photosynthesis and the energy balance; a leaf property, not a fitted trait'
    source: code default; no citation recorded
    placeholder: true
    code: phylloptim::Leaf::alpha_PAR_
  curv_fact_elec_trans:
    section: biochemistry
    symbol: '\theta_J'
    units: '–'
    class: trait
    meaning: 'curvature of the light response of $J$; no temperature dependence'
    source: 'code comment: Smith & Keenan (2020), not in Zotero'
    placeholder: false
    code: phylloptim::Leaf::curv_fact_elec_trans
  curv_fact_colim:
    section: biochemistry
    symbol: '\theta'
    units: '–'
    class: trait
    meaning: 'curvature of the colimitation of $W_c$ and $W_j$; no temperature dependence'
    source: default
    placeholder: false
    code: phylloptim::Leaf::curv_fact_colim
  gas_constant:
    section: biochemistry
    symbol: 'R'
    units: 'J mol⁻¹ K⁻¹'
    class: constant
    meaning: 'universal gas constant, exact since the 2019 SI redefinition'
    source: SI 2019
    placeholder: false
    code: phylloptim::gas_constant
  C_to_K:
    section: biochemistry
    symbol: 'T_0'
    units: 'K'
    class: constant
    meaning: 'Celsius to kelvin offset'
    source: SI
    placeholder: false
    code: phylloptim::C_to_K
  ref_temp:
    section: biochemistry
    symbol: 'T_{25}'
    units: '°C'
    class: constant
    meaning: 'reference temperature of every response, 25 °C = 298.15 K, written `25 + C_to_K` (Medlyn-2002 write 298 K)'
    source: code
    placeholder: false
    literal: 25
    code: phylloptim::Leaf::arrh_curve
  umol_to_mol:
    section: biochemistry
    symbol: '10^{-6}'
    units: 'mol µmol⁻¹'
    class: constant
    meaning: 'unit conversion in the mixing-ratio to partial-pressure factor $c_P$'
    source: definition
    placeholder: false
    code: phylloptim::umol_to_mol
  kPa_to_Pa:
    section: biochemistry
    symbol: '10^{3}'
    units: 'Pa kPa⁻¹'
    class: constant
    meaning: 'unit conversion in $c_P$ and in the O₂ term of $K_m$'
    source: definition
    placeholder: false
    code: phylloptim::kPa_to_Pa
  use_thermal_cost_:
    section: biochemistry
    symbol: 'g_\mathrm{TC}'
    units: '–'
    class: hyperparameter
    meaning: 'gate: the Sicangco instantaneous thermal cost, which scales $J_{max}$ by $1 - TC$'
    source: default off
    placeholder: false
    code: phylloptim::Leaf::use_thermal_cost_
  T50_:
    section: biochemistry
    symbol: 'T_{50}'
    units: '°C'
    class: hyperparameter
    meaning: 'half-damage temperature of the sigmoid thermal cost'
    source: Sicangco-2026 Table 2, heatwave treatment
    cite: Sicangco-2026
    placeholder: false
    code: phylloptim::Leaf::T50_
  Tcrit_:
    section: biochemistry
    symbol: 'T_\mathrm{crit}'
    units: '°C'
    class: hyperparameter
    meaning: 'onset temperature of the thermal cost; $r = 2/(T_{50} - T_\mathrm{crit})$, as the authors'' code computes it and not as their Eqn 8 prints it'
    source: Sicangco-2026 Table 2
    cite: Sicangco-2026
    placeholder: false
    code: phylloptim::Leaf::Tcrit_

  # --- respiration ------------------------------------------------------------
  R_d_25:
    section: respiration
    symbol: 'R_{d,25}'
    units: 'µmol m⁻² s⁻¹'
    class: trait
    meaning: 'leaf dark respiration at 25 °C ($0.015 \times 96$, the value the old $V_{cmax}$-derived form gave)'
    source: derived default
    placeholder: true
    code: phylloptim::Leaf::R_d_25
  rd_q10_intercept_:
    section: respiration
    symbol: 'q_0'
    units: '–'
    class: hyperparameter
    meaning: 'intercept of the declining $Q_{10}$'
    source: 'Atkin-2003 Fig. 2 (foliar: 3.090); the code cites Tjoelker-2001'
    cite: Atkin-2003
    placeholder: false
    code: phylloptim::Leaf::rd_q10_intercept_
  rd_q10_slope_:
    section: respiration
    symbol: 'q_1'
    units: 'K⁻¹'
    class: hyperparameter
    meaning: 'slope of the declining $Q_{10}$; zero makes $Q_{10} = q_0$ constant'
    source: 'Atkin-2003 Fig. 2 (foliar: 0.043); the code cites Tjoelker-2001'
    cite: Atkin-2003
    placeholder: false
    code: phylloptim::Leaf::rd_q10_slope_

  # --- water vapour -----------------------------------------------------------
