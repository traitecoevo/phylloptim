# The model registry (#166): the equations of phylloptim's temperature paths,
# the parameters they read, and the C++ symbol that evaluates each, in one file
# that documents are generated FROM rather than written beside.
#
# Three rules, so it does not rot:
#
#   1. Nothing here stores a line number or a default value. A symbol's file and
#      line come from Doxygen's XML at render time (registry_locations(),
#      registry_resolve()), and a parameter's value is read off a live Leaf, off
#      set_drivers()'s formals, or off the constexpr's initializer in that XML
#      (registry_values()). A `literal:` is the one exception: a number that IS
#      part of an equation's form (Tetens' 17.27) rather than a default, and the
#      equation's replica is what asserts it against the code.
#   2. CI checks it. tests/testthat/test-registry.R asserts every symbol and bound
#      field named here exists, snapshots the bound fields NOT yet covered, and
#      runs every equation's replica against the package (registry_check());
#      docs.yml resolves every `code` in Doxygen's XML and checks each
#      equation's `reads` against what its function references.
#   3. One registry per package. plant's covers its strategies and points at these
#      ids rather than copying them.
#
# Schema. `sections` is id: title, in document order. `parameters` is keyed by
# the name in code; each has section, symbol (LaTeX, no $), units, class (trait |
# hyperparameter | constant | driver), meaning, source (free text), placeholder
# (true where the value is an uncalibrated default or no source is recorded),
# code (the qualified C++ symbol that holds it), and optionally cite (a Zotero
# key, Surname-Year), default_code (the constexpr the member's default is copied
# from), driver (the set_drivers() argument), literal (see rule 1) and aliases
# (other symbols the same quantity is read through, for the references check).
# `equations` is keyed by id; each has section, title, latex, code (the symbol
# that evaluates it, or ~ for an identity with none), reads (parameter ids),
# writes (bound fields it seats), kind (closed_form | identity | derivative |
# integrator), replica (base-R source of the printed equation; other replicas
# are callable by id), and optionally also (further symbols involved), uses
# (other equation ids the replica calls), cite, tol (the check tolerance where
# 1e-10 is not attainable) and note.
#
# To add an equation: an entry here, and a probe of the same id in
# R/registry-probes.R that reads the package side.
#
# YAML 1.1 reads `1e-3` as a string: write floats with a point and a signed
# exponent (1.0e-3, 2.45e+6).

package: phylloptim

sections:
  drivers: Drivers
  biochemistry: Photosynthetic biochemistry
  respiration: Respiration
  vapour: Water vapour and the leaf-to-air deficit
  energy_balance: Energy balance
  damage: Damage, repair and acclimation

parameters:

  # --- drivers ---------------------------------------------------------------
  leaf_temp:
    section: drivers
    symbol: 'T_\mathrm{air} \text{ or } T_\mathrm{leaf}'
    units: '°C'
    class: driver
    meaning: 'the leaf temperature with the energy balance off, the air temperature with it on'
    source: set_drivers() default
    placeholder: false
    code: phylloptim::Leaf::leaf_temp_
    driver: leaf_temp
  PPFD:
    section: drivers
    symbol: 'Q'
    units: 'µmol m⁻² s⁻¹'
    class: driver
    meaning: 'intercepted photosynthetic photon flux per unit leaf area, before absorptance'
    source: set_drivers() default
    placeholder: false
    code: phylloptim::Leaf::PPFD_
    driver: PPFD
  NIR_int_:
    section: drivers
    symbol: 'Q_\mathrm{NIR}'
    units: 'W m⁻²'
    class: driver
    meaning: 'intercepted near-infrared; no default, set on the leaf before set_drivers() (about PPFD / 4.57 in daylight, 0 under an LED); read only with the energy balance on'
    source: 0.13.0, no default by design
    placeholder: false
    code: phylloptim::Leaf::NIR_int_
  atm_vpd:
    section: drivers
    symbol: 'D_\mathrm{air}'
    units: 'kPa'
    class: driver
    meaning: 'air vapour pressure deficit'
    source: set_drivers() default
    placeholder: false
    code: phylloptim::Leaf::atm_vpd_
    driver: atm_vpd
  ca:
    section: drivers
    symbol: 'c_a'
    units: 'Pa'
    class: driver
    meaning: 'atmospheric CO₂ partial pressure'
    source: set_drivers() default
    placeholder: false
    code: phylloptim::Leaf::ca_
    driver: ca
  atm_o2_kpa:
    section: drivers
    symbol: 'O'
    units: 'kPa'
    class: driver
    meaning: 'O₂ partial pressure'
    source: set_drivers() default
    placeholder: false
    code: phylloptim::Leaf::atm_o2_kpa_
    driver: atm_o2_kpa
  atm_kpa:
    section: drivers
    symbol: 'P'
    units: 'kPa'
    class: driver
    meaning: 'atmospheric pressure; the mixing-ratio to partial-pressure factor $c_P = P \times 10^{3} \times 10^{-6}$ is derived from it'
    source: set_drivers() default
    placeholder: false
    code: phylloptim::Leaf::atm_kpa_
    driver: atm_kpa
    aliases: [phylloptim::Leaf::umol_per_mol_to_Pa_]
  wind_speed_:
    section: drivers
    symbol: 'U'
    units: 'm s⁻¹'
    class: driver
    meaning: 'wind speed at the leaf (plant: the wind_speed driver); read only with the energy balance on'
    source: code default
    placeholder: true
    code: phylloptim::Leaf::wind_speed_

  # --- biochemistry ------------------------------------------------------------
  vcmax_25:
    section: biochemistry
    symbol: 'V_{c,25}'
    units: 'µmol m⁻² s⁻¹'
    class: trait
    meaning: 'maximum carboxylation rate at 25 °C'
    source: E. saligna default
    placeholder: false
    code: phylloptim::Leaf::vcmax_25
  jmax_25:
    section: biochemistry
    symbol: 'J_{25}'
    units: 'µmol m⁻² s⁻¹'
    class: trait
    meaning: 'maximum electron transport rate at 25 °C (plant: $1.64\,V_{c,25}$)'
    source: E. saligna default
    placeholder: false
    code: phylloptim::Leaf::jmax_25
  vcmax_ha_:
    section: biochemistry
    symbol: 'E_{a,V}'
    units: 'J mol⁻¹'
    class: hyperparameter
    meaning: 'activation energy of $V_{cmax}$'
    source: 'Medlyn-2002 range; the constants.hpp comment says kJ'
    cite: Medlyn-2002
    placeholder: true
    code: phylloptim::Leaf::vcmax_ha_
    default_code: phylloptim::vcmax_ha
  vcmax_H_d_:
    section: biochemistry
    symbol: 'H_{d,V}'
    units: 'J mol⁻¹'
    class: hyperparameter
    meaning: 'deactivation energy of $V_{cmax}$'
    source: Medlyn-2002 (fixed at 200 kJ)
    cite: Medlyn-2002
    placeholder: true
    code: phylloptim::Leaf::vcmax_H_d_
    default_code: phylloptim::vcmax_H_d
  vcmax_d_S_:
    section: biochemistry
    symbol: '\Delta S_V'
    units: 'J mol⁻¹ K⁻¹'
    class: hyperparameter
    meaning: 'entropy term of $V_{cmax}$'
    source: Medlyn-2002 range
    cite: Medlyn-2002
    placeholder: true
    code: phylloptim::Leaf::vcmax_d_S_
    default_code: phylloptim::vcmax_d_S
  jmax_ha_:
    section: biochemistry
    symbol: 'E_{a,J}'
    units: 'J mol⁻¹'
    class: hyperparameter
    meaning: 'activation energy of $J_{max}$'
    source: Medlyn-2002 range
    cite: Medlyn-2002
    placeholder: true
    code: phylloptim::Leaf::jmax_ha_
    default_code: phylloptim::jmax_ha
  jmax_H_d_:
    section: biochemistry
    symbol: 'H_{d,J}'
    units: 'J mol⁻¹'
    class: hyperparameter
    meaning: 'deactivation energy of $J_{max}$'
    source: Medlyn-2002 (fixed at 200 kJ)
    cite: Medlyn-2002
    placeholder: true
    code: phylloptim::Leaf::jmax_H_d_
    default_code: phylloptim::jmax_H_d
  jmax_d_S_:
    section: biochemistry
    symbol: '\Delta S_J'
    units: 'J mol⁻¹ K⁻¹'
    class: hyperparameter
    meaning: 'entropy term of $J_{max}$'
    source: Medlyn-2002 range
    cite: Medlyn-2002
    placeholder: true
    code: phylloptim::Leaf::jmax_d_S_
    default_code: phylloptim::jmax_d_S
  gamma_25_:
    section: biochemistry
    symbol: '\Gamma^*_{25}'
    units: 'µmol mol⁻¹'
    class: constant
    meaning: 'CO₂ compensation point at 25 °C'
    source: Bernacchi-2001 Table 1
    cite: Bernacchi-2001
    placeholder: false
    code: phylloptim::Leaf::gamma_25_
    default_code: phylloptim::gamma_25
  gamma_ha_:
    section: biochemistry
    symbol: 'E_{a,\Gamma}'
    units: 'J mol⁻¹'
    class: constant
    meaning: 'activation energy of $\Gamma^*$'
    source: Bernacchi-2001 Table 1
    cite: Bernacchi-2001
    placeholder: false
    code: phylloptim::Leaf::gamma_ha_
    default_code: phylloptim::gamma_ha
  kc_25_:
    section: biochemistry
    symbol: 'K_{c,25}'
    units: 'µmol mol⁻¹'
    class: constant
    meaning: 'Rubisco Michaelis constant for CO₂ at 25 °C'
    source: Bernacchi-2001 Table 1
    cite: Bernacchi-2001
    placeholder: false
    code: phylloptim::Leaf::kc_25_
    default_code: phylloptim::kc_25
  kc_ha_:
    section: biochemistry
    symbol: 'E_{a,K_c}'
    units: 'J mol⁻¹'
    class: constant
    meaning: 'activation energy of $K_c$'
    source: Bernacchi-2001 Table 1
    cite: Bernacchi-2001
    placeholder: false
    code: phylloptim::Leaf::kc_ha_
    default_code: phylloptim::kc_ha
  ko_25_:
    section: biochemistry
    symbol: 'K_{o,25}'
    units: 'µmol mol⁻¹'
    class: constant
