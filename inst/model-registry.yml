  TF24_cost_scale:
    section: costs
    symbol: '\gamma'
    units: 'µmol C m⁻² s⁻¹'
    class: trait
    meaning: 'scale of the TF24 hydraulic cost, the carbon cost of losing all conductance; also the hydraulic half of TF24_floor'
    source: 'leaf_traits() default; the cost form is Towers-2024''s, the value carries no citation in the code'
