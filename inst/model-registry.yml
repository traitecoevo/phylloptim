  tetens_b:
    section: vapour
    symbol: '17.27'
    units: '–'
    class: constant
    meaning: 'Tetens coefficient of $e_s(T)$'
    source: FAO-56 form
    placeholder: false
    literal: 17.27
    code: phylloptim::Leaf::saturation_vapour_pressure
  tetens_c:
    section: vapour
    symbol: '237.3'
    units: '°C'
    class: constant
