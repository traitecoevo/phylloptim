    source: Medlyn-2002 (fixed at 200 kJ)
    cite: Medlyn-2002
    placeholder: true
    code: phylloptim::Leaf::vcmax_H_d_
    default_code: phylloptim::vcmax_H_d
  vcmax_d_S_:
    section: biochemistry
    symbol: '\Delta S_V'
    units: 'J mol⁻¹ K⁻¹'
    class: hyperparameter
    meaning: 'entropy term of $V_{cmax}$'
    source: Medlyn-2002 range
