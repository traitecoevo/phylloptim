  TF24_beta2:
    section: costs
    symbol: '\beta'
    units: '–'
    class: trait
    meaning: 'exponent of the TF24 cost on the fractional conductance loss $1 - f$; below 1 the marginal cost diverges at the wet end'
    source: 'leaf_traits() default; the cost form is Towers-2024''s, the value carries no citation in the code'
    cite: Towers-2024
    placeholder: true
    code: phylloptim::Leaf::TF24_beta2
  CF77_lambda_:
    section: costs
    symbol: '\lambda_\mathrm{CF}'
    units: 'µmol C (kg H₂O)⁻¹'
    class: hyperparameter
    meaning: 'the prescribed marginal value of water of the CF77 curve; an input with no default (NA until set, refused unset), never assigned by model code'
    source: 'caller input; no default by design'
    cite: Cowan-1977
    placeholder: false
    code: phylloptim::Leaf::CF77_lambda_
  CF77_soil_beta_:
    section: costs
    symbol: 'g_\beta'
    units: '–'
    class: hyperparameter
    meaning: 'gate: divides the CF77 price by the Medlyn soil-moisture factor $\beta$ (cf77_soil_price), clamped at 1, giving CF77 the soil-moisture shutdown it otherwise lacks; off is bit-identical to the bare constant'
    source: default off
    placeholder: false
    code: phylloptim::Leaf::CF77_soil_beta_
  JS22_gamma:
    section: costs
    symbol: '\gamma_J'
    units: 'µmol C m⁻² s⁻¹ MPa⁻²'
    class: trait
    meaning: 'unit cost of the soil-to-leaf drop in the JS22 hydraulic term; Joshi-2022''s capacity term $\alpha J_{max}$ is not implemented'
    source: 'code default, "not a literature value": order-of-magnitude matched to TF24 at the package defaults (the matching value runs 0.287–1.761 over psi_soil 0.5–3 MPa)'
    cite: Joshi-2022
    placeholder: true
    code: phylloptim::Leaf::JS22_gamma
  CMax_a:
    section: costs
    symbol: 'a'
    units: 'µmol C m⁻² s⁻¹ MPa⁻²'
    class: trait
    meaning: 'slope of the CMax marginal cost, linear in the absolute potential'
    source: 'code default, "neither default is a literature value": mid-range of the 0.406–0.807 that reproduces TF24''s cost at its optimum; the form is Anderegg-2018''s as TractLSM implements it'
    cite: Anderegg-2018
    placeholder: true
    code: phylloptim::Leaf::CMax_a
  CMax_b:
    section: costs
    symbol: 'b'
    units: 'µmol C m⁻² s⁻¹ MPa⁻¹'
    class: trait
    meaning: 'intercept of the CMax marginal cost; SIGNED (negative in the paper''s convention), so not range-checked'
    source: 'code default, not a literature value'
    cite: Anderegg-2018
    placeholder: true
    code: phylloptim::Leaf::CMax_b
  TF24_floor_lambda_o:
    section: costs
    symbol: '\lambda_o'
    units: 'µmol C (kg H₂O)⁻¹'
    class: hyperparameter
    meaning: 'the price of water as transpiration goes to zero, the only parameter of TF24_floor; an input with no default, because at 0 the curve is TF24'
