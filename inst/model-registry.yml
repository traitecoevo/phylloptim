    cite: Medlyn-2002
    placeholder: true
    code: phylloptim::Leaf::jmax_H_d_
    default_code: phylloptim::jmax_H_d
  jmax_d_S_:
    section: biochemistry
    symbol: '\Delta S_J'
    units: 'J mol⁻¹ K⁻¹'
    class: hyperparameter
    meaning: 'entropy term of $J_{max}$'
    source: Medlyn-2002 range
    cite: Medlyn-2002
    placeholder: true
    code: phylloptim::Leaf::jmax_d_S_
    default_code: phylloptim::jmax_d_S
  gamma_25_:
    section: biochemistry
    symbol: '\Gamma^*_{25}'
    units: 'µmol mol⁻¹'
    class: constant
    meaning: 'CO₂ compensation point at 25 °C'
    source: Bernacchi-2001 Table 1
    cite: Bernacchi-2001
    placeholder: false
    code: phylloptim::Leaf::gamma_25_
    default_code: phylloptim::gamma_25
  gamma_ha_:
    section: biochemistry
    symbol: 'E_{a,\Gamma}'
    units: 'J mol⁻¹'
    class: constant
    meaning: 'activation energy of $\Gamma^*$'
    source: Bernacchi-2001 Table 1
    cite: Bernacchi-2001
    placeholder: false
    code: phylloptim::Leaf::gamma_ha_
    default_code: phylloptim::gamma_ha
  kc_25_:
    section: biochemistry
    symbol: 'K_{c,25}'
    units: 'µmol mol⁻¹'
    class: constant
