    source: Bernacchi-2001 Table 1
    cite: Bernacchi-2001
    placeholder: false
    code: phylloptim::Leaf::kc_25_
    default_code: phylloptim::kc_25
  kc_ha_:
    section: biochemistry
    symbol: 'E_{a,K_c}'
    units: 'J mol⁻¹'
    class: constant
